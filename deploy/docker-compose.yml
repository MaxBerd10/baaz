# Ubuntu serverda: Postgres + Telegram bot + Web panel + HTTPS (Caddy).
#   cp .env.example .env && nano .env && docker compose up -d --build
name: baaz

x-bot-build: &bot-build
  # Bot manba kodi: standart — GitHub'dan. Lokal nusxadan qurish uchun .env da BOT_SRC=../../truck-factory-bot
  context: ${BOT_SRC:-https://github.com/MaxBerd10/truck-factory-bot.git#main}
  additional_contexts:
    botfixes: ./bot-fixes     # build paytida botga qo'llanadigan tuzatishlar (bot-fixes/patch_bot.py)
  # Botning o'z Dockerfile'i locales/, alembic.ini va migrations/ ni image'ga olmaydi — shuning uchun o'zimiznikini beramiz.
  dockerfile_inline: |
    FROM python:3.11-slim
    WORKDIR /app
    RUN apt-get update && apt-get install -y --no-install-recommends gcc postgresql-client \
        && rm -rf /var/lib/apt/lists/*
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt
    COPY . .
    COPY --from=botfixes . /tmp/botfixes/
    RUN python /tmp/botfixes/patch_bot.py
    RUN mkdir -p /app/media /app/logs && useradd -m -u 1000 botuser && chown -R botuser:botuser /app
    USER botuser
    CMD ["python", "-m", "src.main"]

x-bot-env: &bot-env
  BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN ni .env ga yozing}
  ADMIN_IDS: ${ADMIN_IDS:?ADMIN_IDS ni .env ga yozing, masalan [123456789]}
  ENVIRONMENT: production
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-truckbot}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni .env ga yozing}
  POSTGRES_DB: ${POSTGRES_DB:-truck_factory}
  MEDIA_ROOT: /app/media
  TZ: ${TZ:-Asia/Tashkent}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-truckbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni .env ga yozing}
      POSTGRES_DB: ${POSTGRES_DB:-truck_factory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Bir martalik: botning migratsiyalari + moslashtirish SQL'i. Har `up` da qayta ishlaydi (xavfsiz).
  migrate:
    build: *bot-build
    image: baaz-bot:local
    command: sh -c "alembic upgrade head && psql -v ON_ERROR_STOP=1 -q -f /compat.sql"
    environment:
      <<: *bot-env
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-truckbot}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-truck_factory}
    volumes:
      - ./bot-compat.sql:/compat.sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    image: baaz-bot:local
    build: *bot-build
    restart: unless-stopped
    environment: *bot-env
    volumes:
      - bot_media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: baaz-web:local
    restart: unless-stopped
    environment:
      BOT_DB: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-truckbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-truck_factory}
      BOT_TOKEN: ${BOT_TOKEN}   # faqat rasmlarni Telegram'dan olib ko'rsatish uchun
      WEB_PASSWORD: ${WEB_PASSWORD:?WEB_PASSWORD ni .env ga yozing}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY ni .env ga yozing}
      TZ: ${TZ:-Asia/Tashkent}
      SHOW_ERRORS: "0"         # xato tafsilotlari (traceback) brauzerga chiqmasin
      MEDIA_ROOT: /app/media   # model rasmlari va Telegram keshi shu yerga yoziladi
      BOT_MEDIA_ROOT: /botmedia   # botning ishchilar yuborgan rasm/videolari (faqat o'qish)
      BOT_MEDIA_PREFIX: /app/media
    volumes:
      - web_media:/app/media
      - bot_media:/botmedia:ro
    # Web ko'rinishlarini (VIEW) har ishga tushganda yangilaydi, keyin serverni ko'taradi.
    command: >
      sh -c "python -m app.botdb install &&
             exec uvicorn app.web.main:app --host 0.0.0.0 --port 8080
             --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/login', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    # Faqat shu serverning o'zida (127.0.0.1) ochiladi; tashqariga Cloudflare Tunnel yoki Caddy chiqaradi.
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Ixtiyoriy: Cloudflare Tunnel ishlatmasangiz — `docker compose --profile caddy up -d` (80/443 ochiq bo'lishi kerak)
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  bot_media:
  web_media:
  caddy_data:
  caddy_config:
