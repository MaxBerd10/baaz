[project]
name = "baaz-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy==2.0.36",
    "greenlet==3.1.1",
    "aiosqlite==0.20.0",
    "asyncpg==0.30.0",
    "pydantic-settings==2.6.1",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "jinja2==3.1.4",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.17",
]

[tool.vercel]
entrypoint = "app.web.main:app"
