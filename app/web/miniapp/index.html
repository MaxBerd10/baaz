<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f2f3f8);
  --card:var(--tg-theme-bg-color,#ffffff);
  --text:var(--tg-theme-text-color,#14172a);
  --hint:var(--tg-theme-hint-color,#6b7287);
  --accent:var(--tg-theme-button-color,#6d5df6);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --line:rgba(120,128,150,.22);
  --ok:#17a870; --bad:#e5484d; --warn:#f59e0b; --info:#3b82f6;
  --r:18px; --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(86px + var(--safe))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img,video{max-width:100%;display:block}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
h1{font-size:22px;margin:0;letter-spacing:-.01em} h2{font-size:19px;margin:0}
.hint{color:var(--hint);font-size:15px}
.top{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.top .who{flex:1;min-width:0}
.top .who b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:19px;object-fit:cover;flex:none}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:20px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:14px;font-weight:650;background:rgba(120,128,150,.16)}
.chip.ok{background:rgba(23,168,112,.15);color:var(--ok)} .chip.bad{background:rgba(229,72,77,.15);color:var(--bad)}
.chip.warn{background:rgba(245,158,11,.18);color:#b97500} .chip.info{background:rgba(59,130,246,.15);color:var(--info)}
.list{display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 6px rgba(0,0,0,.06);overflow:hidden}
.task{display:flex;gap:13px;width:100%;text-align:left;padding:12px;align-items:flex-start}
.task .img{flex:none;width:96px;height:96px;border-radius:14px;background:linear-gradient(135deg,#e9ebf5,#f6f7fb);display:grid;place-items:center;font-size:38px;position:relative;overflow:hidden}
.task .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.task .body{flex:1;min-width:0}
.task .ttl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.task .ttl b{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .task .go{color:var(--hint);font-size:26px;line-height:1}
.task .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.task .chip{font-size:13px;padding:3px 9px}
.steps{display:flex;align-items:center;gap:4px;margin-top:9px}
.steps i{flex:0 1 24px;min-width:10px;height:6px;border-radius:3px;background:var(--line)}
.steps i.d{background:var(--ok)} .steps i.c{background:var(--accent)}
.steps span{font-size:13px;color:var(--hint);margin-left:5px;white-space:nowrap;font-weight:600}
.sk{background:linear-gradient(90deg,rgba(120,128,150,.13) 25%,rgba(120,128,150,.25) 37%,rgba(120,128,150,.13) 63%);background-size:400% 100%;animation:shim 1.3s ease infinite;border-radius:10px}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skc{display:flex;gap:13px;padding:12px;align-items:flex-start} .skc .sk:first-child{width:96px;height:96px;border-radius:14px;flex:none}
.skc>div{flex:1} .skc .sk+.sk{height:14px;margin-bottom:9px}
.dl{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)} .dl:first-child{border-top:0}
.dl .who{flex:1;min-width:0} .dl b{display:block} .dl small{color:var(--hint)}
.sub{margin:18px 2px 8px;color:var(--hint);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.banner{margin:10px 0 0;padding:10px 12px;border-radius:12px;font-size:15px;background:rgba(229,72,77,.12);color:var(--bad);font-weight:600}
.empty{text-align:center;padding:44px 20px;color:var(--hint)} .empty .big{font-size:54px;margin-bottom:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + var(--safe));z-index:5}
.tabs button{flex:1;padding:9px 6px;border-radius:14px;color:var(--hint);font-size:14px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .ic{font-size:24px;line-height:1} .tabs button.on{color:var(--accent)}
.tabs .badge{position:absolute;margin:-4px 0 0 22px;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:1px 6px;min-width:19px;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:58px;border-radius:16px;background:var(--accent);color:var(--accent-text);font-size:19px;font-weight:700;padding:12px 18px}
.btn.ok{background:var(--ok);color:#fff} .btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.hero{height:210px;position:relative;background:linear-gradient(135deg,#e9ebf5,#f6f7fb);display:grid;place-items:center;font-size:64px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sect{padding:14px 16px;border-top:1px solid var(--line)} .sect:first-child{border-top:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0} .kv span:first-child{color:var(--hint)} .kv b{text-align:right}
.note{white-space:pre-wrap;font-size:16px}
.actions{display:grid;gap:12px;margin-top:14px;position:sticky;bottom:calc(10px + var(--safe));padding:10px 0 4px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{min-height:92px;flex-direction:column;gap:4px;font-size:17px;background:var(--card);color:var(--text);box-shadow:inset 0 0 0 2px var(--accent);border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:10px}
.pick .ic{font-size:34px;line-height:1}
.pick[disabled]{opacity:.4;pointer-events:none;box-shadow:inset 0 0 0 2px var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e4e6ef}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:17px;line-height:30px}
.thumb .vid{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;border-radius:7px;padding:1px 7px;font-size:13px}
.thumb .ov{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;text-align:center;padding:4px}
.thumb .ov.err{background:rgba(229,72,77,.82)}
.bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.35)} .bar i{display:block;height:100%;background:#fff}
textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;padding:12px;resize:vertical}
.cnt{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 14px;margin:0 -14px}
.gal>*{flex:0 0 82%;scroll-snap-align:center;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;position:relative}
.gal img,.gal video{width:100%;height:100%;object-fit:contain;background:#111}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--safe));max-height:90vh;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips button{padding:10px 14px;border-radius:99px;background:var(--bg);font-size:16px;font-weight:600}
.chips button.on{background:var(--accent);color:var(--accent-text)}
.viewer{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center}
.viewer img,.viewer video{max-width:100%;max-height:100%} .viewer .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:24px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(98px + var(--safe));background:#1b1e2e;color:#fff;border-radius:14px;padding:13px 16px;z-index:40;font-weight:600;text-align:center}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.center .big{font-size:64px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:18px 16px} .tile b{display:block;font-size:34px;line-height:1.1} .tile span{color:var(--hint);font-size:15px}
.who2{display:flex;align-items:center;gap:10px}
.who2 .avatar{width:38px;height:38px;font-size:16px}
</style>

async function authenticate() {
  const init = (DEV && qs.get("init")) || (tg && tg.initData) || "";
  if (!init) throw new ApiError("no_telegram", 0);
  const r = await fetch("/app/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ init_data: init }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new ApiError(j.error || "server", r.status), { name_: j.name });
  S.token = j.token; S.user = j.user; S.counts = j.counts || {}; S.lang = j.user.lang || "uz";
  document.documentElement.lang = S.lang === "ru" ? "ru" : "uz";
  return j;
}

async function api(path, opts = {}, retry = true) {
  const o = { method: opts.method || "GET", headers: { Authorization: "Bearer " + S.token } };
  if (opts.json !== undefined) { o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(opts.json); }
  let r;
  try { r = await fetch(path, o); } catch (e) { throw new ApiError("network", 0); }
  if (r.status === 401 && retry) { await authenticate(); return api(path, opts, false); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new ApiError(j.error || "server", r.status);
  return j;
}

/* ============================== Yordamchilar ============================== */
function ago(iso) {
  if (!iso) return "";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (m < 1) return t("just_now");
  if (m < 60) return t("min_ago", { n: m });
  if (m < 1440) return t("hour_ago", { n: Math.round(m / 60) });
  return t("day_ago", { n: Math.round(m / 1440) });
}
function deadlineChip(iso) {
  if (!iso) return "";
  const d = new Date(iso), now = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((a - b) / 86400000);
  const fmt = `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}`;
  if (diff < 0) return `<span class="chip bad">📅 ${t("overdue", { n: -diff })}</span>`;
  if (diff === 0) return `<span class="chip warn">📅 ${t("today")}</span>`;
  if (diff === 1) return `<span class="chip warn">📅 ${t("tomorrow")}</span>`;
  return `<span class="chip">📅 ${fmt}</span>`;
}
const prioChip = (p) => (!p || p === "normal") ? "" :
  `<span class="chip ${p === "urgent" ? "bad" : p === "high" ? "warn" : ""}">${p === "urgent" ? "🔴" : p === "high" ? "🟠" : "🟢"} ${t("prio_" + p)}</span>`;
const statusChip = (s) => ({
  pending: `<span class="chip">${t("s_pending")}</span>`, in_review: `<span class="chip info">⏳ ${t("s_in_review")}</span>`,
  approved: `<span class="chip ok">✅ ${t("s_approved")}</span>`, rejected: `<span class="chip bad">↩️ ${t("s_rejected")}</span>`,
}[s] || "");
const avatar = (id, name, has) => has
  ? `<img class="avatar" src="${userUrl(id)}" alt="">`
  : `<div class="avatar">${esc((name || "?").trim().charAt(0).toUpperCase())}</div>`;

function approveFlow(d) {
  const go = async () => {
    try { await api(`/app/api/step/${d.step_id}/approve`, { method: "POST", json: {} }); HAPTIC("success"); toast(t("done_ok"), "ok"); backToList(); }
    catch (e) { HAPTIC("error"); toast(errText(e), "bad"); }
  };
  if (tg && tg.showConfirm) tg.showConfirm(t("approve_q"), (ok) => ok && go()); else if (confirm(t("approve_q"))) go();
}
function rejectSheet(d) {
  let reason = "";
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet"><h2>${t("reject_title")}</h2><div class="chips">${t("reasons").map((r) => `<button data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>
    <textarea placeholder="${esc(t("reject_ph"))}"></textarea>
    <div class="row2" style="margin-top:12px"><button class="btn ghost" id="c">${t("cancel")}</button><button class="btn bad" id="s" disabled>${t("send_reject")}</button></div></div>`;
  document.body.appendChild(bg);
  const ta = bg.querySelector("textarea"), send = bg.querySelector("#s");
  const upd = () => { reason = ta.value.trim(); send.disabled = reason.length < 3; };
  ta.oninput = upd;
  bg.querySelectorAll("[data-r]").forEach((b) => b.onclick = () => { ta.value = b.dataset.r; upd(); bg.querySelectorAll("[data-r]").forEach((x) => x.classList.toggle("on", x === b)); });
  bg.querySelector("#c").onclick = () => bg.remove();
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  send.onclick = async () => {
    send.disabled = true;
    try { await api(`/app/api/step/${d.step_id}/reject`, { method: "POST", json: { reason } }); HAPTIC("warning"); bg.remove(); toast(t("rejected_ok")); backToList(); }
    catch (e) { send.disabled = false; HAPTIC("error"); toast(errText(e), "bad"); }
  };
}

}
function counts() {
  const c = { photo: 0, video: 0 };
  U.items.forEach((i) => { if (i.state !== "removed") c[i.kind]++; });
  return c;
}
function submitState() {
  const c = counts(), lim = U.step.limits;
  const pending = U.items.some((i) => i.state === "queued" || i.state === "up"), failed = U.items.some((i) => i.state === "err");
  return { c, lim, pending, ready: c.photo + c.video > 0 && !pending && !failed };
}
function gridHtml() { return U.items.filter((i) => i.state !== "removed").map(thumbHtml).join(""); }
function bindThumbs() {
  document.querySelectorAll("[data-rm]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); removeItem(b.dataset.rm); });
  document.querySelectorAll("[data-rt]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); const it = U.items.find((i) => i.key === b.dataset.rt); if (it) { it.state = "queued"; it.pct = 0; drawSubmit(); pump(); } });
}
function drawSubmit() {
  if (!U) return;
  if (document.getElementById("pickers")) return patchSubmit();
  const d = U.step, { c, lim, pending, ready } = submitState();
  render(`<div class="wrap"><div class="card"><div class="sect"><h1>${esc(d.serial_number)}</h1><div class="hint">${esc(stepName(d.step_number))}</div>
    ${d.status === "rejected" && d.qc_comment ? `<div class="banner">↩️ ${t("reason")}: ${esc(d.qc_comment)}</div>` : ""}</div>
    <div class="sect"><div class="row2" id="pickers">
      <button class="pick" id="pp"><span class="ic">📷</span>${t("add_photo")}</button>
      <button class="pick" id="pv"><span class="ic">🎥</span>${t("add_video")}</button></div>
      <div class="cnt" id="cnt"></div><div class="grid" id="grid"></div></div>
    <div class="sect"><textarea id="cm" placeholder="${esc(t("comment_ph"))}">${esc(U.comment)}</textarea></div></div>
    <div class="actions"><button class="btn ok" id="go">✅ ${t("submit")}</button></div></div>
    <input type="file" id="fp" accept="image/*" multiple hidden><input type="file" id="fv" accept="video/*" multiple hidden>`);
  document.getElementById("pp").onclick = () => document.getElementById("fp").click();
  document.getElementById("pv").onclick = () => document.getElementById("fv").click();
  document.getElementById("fp").onchange = (e) => { addFiles([...e.target.files], "photo"); e.target.value = ""; };
  document.getElementById("fv").onchange = (e) => { addFiles([...e.target.files], "video"); e.target.value = ""; };
  document.getElementById("cm").oninput = (e) => { U.comment = e.target.value; };
  document.getElementById("go").onclick = doSubmit;
  patchSubmit();
}
function patchSubmit() {
  const { c, lim, pending, ready } = submitState();
  document.getElementById("pp").disabled = c.photo >= lim.photos;
  document.getElementById("pv").disabled = c.video >= lim.videos;
  document.getElementById("cnt").innerHTML = `<span class="chip">📷 ${t("photos")}: ${c.photo}/${lim.photos}</span><span class="chip">🎥 ${t("videos")}: ${c.video}/${lim.videos}</span>`;
  const g = document.getElementById("grid"), html = gridHtml();
  if (g.dataset.h !== html) { g.innerHTML = html; g.dataset.h = html; bindThumbs(); }
  const go = document.getElementById("go");
  go.disabled = !ready; go.innerHTML = pending ? "⏳ " + t("uploading") : "✅ " + t("submit");
}
function thumbHtml(i) {
  const media = i.kind === "video"
    ? (i.thumb && i.local ? `<video src="${i.thumb}#t=0.1" muted playsinline preload="metadata"></video>` : `<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:34px">🎥</div>`)
    : `<img src="${i.thumb}" alt="">`;
  let ov = "";
  if (i.state === "queued") ov = `<div class="ov">…</div>`;
  else if (i.state === "up") ov = `<div class="ov">${Math.round(i.pct)}%</div><div class="bar"><i style="width:${i.pct}%"></i></div>`;
  else if (i.state === "err") ov = `<div class="ov err"><div>⚠️<br><button data-rt="${i.key}" style="color:#fff;text-decoration:underline">${t("retry")}</button></div></div>`;
  return `<div class="thumb">${media}${i.kind === "video" ? `<span class="vid">🎥</span>` : ""}${ov}<button class="x" data-rm="${i.key}">✕</button></div>`;
}
async function shrink(file) {
  if (!file.type.startsWith("image/")) return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const k = Math.min(1, 1920 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", 0.86));
    if (blob && blob.size < file.size) return new File([blob], "photo.jpg", { type: "image/jpeg" });
  } catch (e) {}
  return file;
}
function addFiles(files, kind) {
  if (!U) return;
  const lim = U.step.limits, c = counts();
  const room = (kind === "photo" ? lim.photos : lim.videos) - c[kind];
  if (files.length > room) toast(t(kind === "photo" ? "err_limit_photos" : "err_limit_videos", { n: kind === "photo" ? lim.photos : lim.videos }), "bad");
  files.slice(0, Math.max(0, room)).forEach((f) => {
    U.items.push({ key: "l" + (++U.seq), kind, state: "queued", pct: 0, file: f, local: true, thumb: URL.createObjectURL(f) });
  });
  drawSubmit(); pump();
}
async function pump() {
  if (!U) return;
  while (U && U.running < 2) {
    const it = U.items.find((i) => i.state === "queued");
    if (!it) break;
    it.state = "up"; U.running++; drawSubmit();
    uploadOne(it).finally(() => { if (U) { U.running--; drawSubmit(); pump(); } });
  }
}
function xhrUpload(file, stepId, onprog) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", `/app/api/step/${stepId}/upload`); x.setRequestHeader("Authorization", "Bearer " + S.token);
    x.upload.onprogress = (e) => e.lengthComputable && onprog(e.loaded / e.total * 100);
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
      if (x.status >= 200 && x.status < 300) resolve(j); else reject(new ApiError(j.error || (x.status === 401 ? "auth" : "server"), x.status)); };
    x.onerror = () => reject(new ApiError("network", 0)); x.ontimeout = () => reject(new ApiError("network", 0)); x.timeout = 10 * 60 * 1000;
    const fd = new FormData(); fd.append("file", file); x.send(fd);
  });
}
async function uploadOne(it) {
  try {
    const file = it.kind === "photo" ? await shrink(it.file) : it.file;
    let res;
    try { res = await xhrUpload(file, U.step.step_id, (p) => { if (p - it.pct >= 3 || p >= 99) { it.pct = p; drawSubmit(); } }); }
    catch (e) { if (e.status === 401) { await authenticate(); res = await xhrUpload(file, U.step.step_id, (p) => { if (p - it.pct >= 3 || p >= 99) { it.pct = p; drawSubmit(); } }); } else throw e; }
    if (it.state === "removed") { api(`/app/api/step/${U.step.step_id}/media/${res.id}`, { method: "DELETE" }).catch(() => {}); return; }
    it.id = res.id; it.state = "done"; it.pct = 100;
  } catch (e) {
    if (it.state === "removed") return;
    it.state = "err"; it.err = e.code;
    if (["limit_photos", "limit_videos", "bad_file", "too_big", "not_available"].includes(e.code)) { toast(errText(e), "bad"); it.state = "removed"; }
  }
}
async function removeItem(key) {
  const it = U.items.find((i) => i.key === key); if (!it) return;
  const wasDone = it.state === "done" && it.id;
  it.state = "removed"; drawSubmit();
  if (wasDone) api(`/app/api/step/${U.step.step_id}/media/${it.id}`, { method: "DELETE" }).catch(() => {});
}
async function doSubmit() {
  const b = document.getElementById("go"); b.disabled = true; b.textContent = "⏳ " + t("sending");
  try {
    await api(`/app/api/step/${U.step.step_id}/submit`, { method: "POST", json: { comment: U.comment } });
    HAPTIC("success"); U = null; try { tg && tg.disableClosingConfirmation && tg.disableClosingConfirmation(); } catch (e) {}
    S.stack = []; setBack();
    render(`<div class="center"><div class="big">✅</div><h1>${t("sent_title")}</h1><p class="hint">${t("sent_hint")}</p>
      <button class="btn" id="back" style="max-width:300px;margin-top:14px">${t("back_tasks")}</button></div>`);
    document.getElementById("back").onclick = () => { S.tab = "tasks"; home(); };
  } catch (e) { HAPTIC("error"); toast(errText(e), "bad"); drawSubmit(); }
}
async function leaveSubmit() {
  if (!U) return true;
  const unsent = U.items.some((i) => i.state !== "removed");
  if (unsent && !(await new Promise((res) => { if (tg && tg.showConfirm) tg.showConfirm(t("unsent"), res); else res(confirm(t("unsent"))); }))) return false;
  U = null; try { tg && tg.disableClosingConfirmation && tg.disableClosingConfirmation(); } catch (e) {}
  return true;
}

/* ================================== Boshlash ================================== */
async function boot() {
  try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {}
  try {
    const j = await authenticate();
    const go = qs.get("go"), id = +qs.get("id");
    history.replaceState(null, "", location.pathname);
    if (go === "step" && id) { S.tab = j.user.role === "qc" ? "queue" : "tasks"; push(() => openStep(id)); return; }
    home();
  } catch (e) {
    const L = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code === "ru") ? "ru" : "uz";
    S.lang = L;
    const box = (ic, h, p) => render(`<div class="center"><div class="big">${ic}</div><h2>${h}</h2><p class="hint">${p}</p></div>`);
    if (e.code === "no_telegram") return box("📱", t("in_tg"), t("in_tg_hint"));
    if (e.code === "not_registered") return box("👋", t("not_registered"), t("not_registered_hint"));
    if (e.code === "inactive") return box("⏸", t("inactive"), t("inactive_hint"));
    errorScreen(e, boot);
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.user && !U && S.stack.length === 0 && S.user.role !== "admin") refreshQuiet(); });
boot();
</script>
