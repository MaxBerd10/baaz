{% extends "base.html" %}
{% block title %}Kirish — Baaz{% endblock %}
{% block bare %}
<div class="login">
  <div class="card pad">
    <div style="display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-bottom:16px">
      <span style="width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff">B</span>
      Baaz
    </div>
    <form method="post" action="/login">
      <input type="password" name="password" placeholder="Parol" autofocus autocomplete="current-password">
      <button type="submit">Kirish</button>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
    </form>
  </div>
</div>
{% endblock %}
